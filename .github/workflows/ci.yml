# CI for the letsdo gem.
#
# Runs on every push to any branch:
#   1. Build check: the gem assembles cleanly (gem build letsdo.gemspec).
#   2. Install check: the built gem installs with its normal post-install
#      RDoc hook (no --no-document) and `letsdo --version` runs. This guards
#      the exact plain `gem install` path a user runs. On a healthy Ruby the
#      hook must not crash (TASK-80); a broken rdoc/rbs default-gem pair is
#      an environment issue and is called out separately in the docs.
#   3. Tests: rake test ends with 0 failures, 0 errors.
#   4. Style: default RuboCop over lib/, bin/, test/ — the job fails on
#      any offense. No project .rubocop.yml; the installed gem's defaults
#      are used as-is.
#
# Tests use only the built-in Minitest (rake and minitest ship as default
# gems with Ruby), so the workflow runs on a clean Ruby — no bundle install.
# RuboCop is installed the same way (gem install), pinned to the 1.77.x
# series declared in the gemspec.
name: CI

on:
  push:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Explicit Ruby 3.x and 4.x — satisfies letsdo.gemspec
        # required_ruby_version: ">= 3.3". Ruby 4.0 covers the release
        # where a partial gem update can leave rdoc/rbs out of sync
        # (TASK-80), so the plain install path is exercised there too.
        ruby: ["3.3", "4.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Build gem
        run: gem build letsdo.gemspec

      - name: Verify install
        run: |
          # Guard the exact plain install path a user runs (no --no-document,
          # so the post-install RDoc hook must load rdoc and succeed). A fresh
          # Ruby ships a coherent rdoc/rbs set; if `require "rdoc"` already
          # fails (rdoc 8.0.0 needs rbs >= 4.0.0, only rbs 3.x present — a
          # partial gem update broke the pair), repair the environment first
          # so the hook still runs (TASK-80), then install plainly.
          ruby -e 'require "rdoc"; exit 0' || gem install rbs -v '>= 4.0.0'
          gem install ./letsdo-*.gem
          letsdo --version

      - name: Run tests
        run: rake test

      - name: Run RuboCop
        run: |
          gem install rubocop -v '~> 1.77.0'
          rubocop --no-server lib bin test
